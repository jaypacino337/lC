<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="PumpXBT">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd0a8"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22252b"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ff8f3d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8f3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="27" fill="#0c0d10"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="25.5" fill="none" stroke="#ff8f3d" stroke-opacity=".3" stroke-width="3"/>

  <!-- hooded agent silhouette -->
  <path d="M60 16c-24 0-38 17-40 38-1 12 1 24 3 32 1 4 4 7 8 7h58c4 0 7-3 8-7 2-8 4-20 3-32-2-21-16-38-40-38z"
        fill="url(#hood)" stroke="url(#rim)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- face void -->
  <ellipse cx="60" cy="62" rx="24" ry="21" fill="#05070a"/>
  <ellipse cx="60" cy="58" rx="26" ry="20" fill="url(#glow)" opacity=".5"/>

  <!-- visor -->
  <rect x="38" y="54" width="44" height="10" rx="5" fill="#ff8f3d"/>
  <rect x="38" y="54" width="44" height="10" rx="5" fill="none" stroke="#ffd0a8" stroke-opacity=".7" stroke-width="1.4"/>
  <rect x="44" y="56.4" width="14" height="2.6" rx="1.3" fill="#fff1e4" opacity=".85"/>

  <!-- pill badge on the hood -->
  <g transform="rotate(-24 34 33)">
    <rect x="21" y="27" width="26" height="12.5" rx="6.25" fill="#fff1e4"/>
    <path d="M34 27h6.75a6.25 6.25 0 0 1 0 12.5H34z" fill="#ff7a1a"/>
    <rect x="21" y="27" width="26" height="12.5" rx="6.25" fill="none" stroke="#0c0d10" stroke-width="2.6"/>
  </g>

  <!-- signal tick under the chin -->
  <path d="M44 95l8-8 6 5 10-11 8 7" fill="none" stroke="#ff8f3d" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
</svg>
